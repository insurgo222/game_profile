name: Sync and Convert All Rules

on:
  schedule:
    - cron: '0 20 * * *' # 每天北京时间凌晨 4:00 自动同步
  workflow_dispatch:

# 关键修复 1：授予工作流写入仓库的权限，解决 git push 403 失败
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # 升级到 v5 以消除 Node.js 20 弃用警告
        uses: actions/checkout@v5

      - name: Install Mihomo Core
        run: |
          set -e
          # 关键修复 2：携带 GITHUB_TOKEN 请求 API，防止共享 IP 触发限流导致获取不到版本号
          RELEASE_TAG=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          echo "Latest Mihomo version: ${RELEASE_TAG}"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${RELEASE_TAG}/mihomo-linux-amd64-${RELEASE_TAG}.gz" | gzip -d > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Process Rulesets
        run: |
          mkdir -p rules

          # 转换函数: 仅用于 domain 和 ipcidr 转 mrs（增加 -f 避免将 404 页面当作规则）
          convert_rule() {
            local behavior=$1
            local format=$2
            local url=$3
            local name=$4
            echo "Converting [$behavior] $name to MRS..."
            if curl -fsSL --connect-timeout 15 --retry 3 "$url" -o "temp_${name}.${format}"; then
              ./mihomo convert-ruleset "$behavior" "$format" "temp_${name}.${format}" "rules/${name}.mrs" || echo "Failed to convert $name"
              rm -f "temp_${name}.${format}"
            else
              echo "Download failed for $name: $url"
            fi
          }

          # 下载函数: 用于直接同步 MRS 或原始 YAML/List 文件
          sync_file() {
            local url=$1
            local target_path=$2
            echo "Syncing $target_path..."
            curl -fsSL --connect-timeout 15 --retry 3 "$url" -o "$target_path" || echo "Failed to download $url"
          }

          # ================= 1. 同步上游现成的 MRS =================
          sync_file "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs" "rules/fakeip-filter.mrs"
          sync_file "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs" "rules/fakeip-cn.mrs"
          sync_file "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.mrs" "rules/fakeip-proxy.mrs"
          sync_file "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs" "rules/cn_domain.mrs"

          # ================= 2. 域名规则转 MRS (Domain -> MRS) =================
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt" "reject"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt" "icloud"
          convert_rule domain yaml "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple_Domain.yaml" "apple_domain"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt" "google"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt" "proxy"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt" "direct"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt" "private"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt" "gfw"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt" "tld-not-cn"
          convert_rule domain yaml "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml" "AWAvenue-Ads-Rule-Clash"
          convert_rule domain yaml "https://cdn.jsdelivr.net/gh/Accademia/Additional_Rule_For_Clash@master/Gemini/Gemini_Domain.yaml" "gemini"

          # ================= 3. IP-CIDR 规则转 MRS (IPCIDR -> MRS) =================
          convert_rule ipcidr yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt" "telegramcidr"
          convert_rule ipcidr yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt" "cncidr"
          convert_rule ipcidr yaml "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt" "lancidr"

          # ================= 4. Classical 规则原样同步 (保存为 yaml/txt) =================
          sync_file "https://gist.githubusercontent.com/cnfree8964/0864fd1d2e88936a095fb40d74ce4993/raw/collection.yaml" "rules/collection.yaml"
          sync_file "https://raw.githubusercontent.com/insurgo222/game_profile/main/dota2.yaml" "rules/dota2.yaml"
          sync_file "https://raw.githubusercontent.com/insurgo222/game_profile/main/forza6.yaml" "rules/forza6.yaml"
          sync_file "https://raw.githubusercontent.com/insurgo222/game_profile/main/in.yaml" "rules/in.yaml"
          sync_file "https://raw.githubusercontent.com/insurgo222/game_profile/main/out.yaml" "rules/out.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Binance/Binance.yaml" "rules/binance.yaml"
          sync_file "https://cdn.jsdelivr.net/gh/Femoon/clash-rules/steam.yaml" "rules/steam_track.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple_Classical.yaml" "rules/apple.yaml"
          sync_file "https://raw.githubusercontent.com/insurgo222/game_profile/main/apple_push.yaml" "rules/apple_push.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml" "rules/steam.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.yaml" "rules/steamcn.yaml"
          sync_file "https://raw.githubusercontent.com/Z-Siqi/Clash-for-Windows_Rule/main/Rule/Epic-Games" "rules/epic_game.yaml"
          sync_file "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt" "rules/applications.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleTV/AppleTV.yaml" "rules/appletv.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/FitnessPlus/FitnessPlus.yaml" "rules/fitnessplus.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppStore/AppStore.yaml" "rules/appstore.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleProxy/AppleProxy.yaml" "rules/appleproxy.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleMusic/AppleMusic.yaml" "rules/applemusic.yaml"
          sync_file "https://cdn.jsdelivr.net/gh/Accademia/Additional_Rule_For_Clash@master/AppleAI/AppleAI.yaml" "rules/appleintelligence.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Xbox/Xbox.yaml" "rules/xbox.yaml"
          sync_file "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PrivateTracker/PrivateTracker.yaml" "rules/privatetracker.yaml"

      - name: Commit and Push Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto update rules [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push
